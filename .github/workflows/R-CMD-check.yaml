name: Isolated frozen archive Windows R-devel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cran071-frozen-win-devel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MAKEFLAGS: '-j2'
      NOT_CRAN: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_LIMIT_CORES_: 'true'
    steps:
      - name: Download and verify the pinned draft asset before setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cran071-dd8a811f-isolated'
          if (Test-Path $root) { throw 'Diagnostic directory already exists' }
          New-Item -ItemType Directory -Path "$root/input", "$root/records" | Out-Null
          $file = Join-Path $root 'input/gllvmTMB_0.7.1.tar.gz'
          curl.exe --fail --location --silent --show-error -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -o $file https://api.github.com/repos/itchyshin/gllvmTMB/releases/assets/647209908
          if ($LASTEXITCODE -ne 0) { throw 'Pinned draft asset download failed; do not substitute another archive' }
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          $bytes = (Get-Item $file).Length
          if ($hash -ne 'dd8a811fbc273774db44b3284ca7cac7b724da5539c5fafebc14fcac0a2df557' -or $bytes -ne 4428330) { throw 'Frozen archive identity mismatch' }
          @{sha256=$hash; size_bytes=$bytes; release_id=414918132; asset_id=647209908; source_commit='876b4fab7a50404ce2765e8924f69b5085e2d0c4'; fetched_utc=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Set-Content "$root/records/asset-identity.json"
          $privateLibrary = Join-Path $env:RUNNER_TEMP 'cran071-private-library'
          New-Item -ItemType Directory -Path $privateLibrary -Force | Out-Null
          "R_LIBS_USER=$privateLibrary" >> $env:GITHUB_ENV
          "DIAG_ROOT=$root" >> $env:GITHUB_ENV
          "FROZEN_ARCHIVE=$file" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
        with:
          ref: 876b4fab7a50404ce2765e8924f69b5085e2d0c4
          fetch-depth: 1
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::jsonlite
          needs: check
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Check the exact archive in clean directories
        shell: Rscript {0}
        run: |
          main <- function() {
            root <- Sys.getenv('DIAG_ROOT')
            records <- file.path(root, 'records')
            archive <- Sys.getenv('FROZEN_ARCHIVE')
            inspection <- file.path(root, 'inspection')
            checkdir <- file.path(root, 'check')
            stopifnot(!dir.exists(inspection), !dir.exists(checkdir))
            dir.create(inspection)
            dir.create(checkdir)
            sha256 <- function(path) {
              out <- system2('certutil', c('-hashfile', shQuote(path), 'SHA256'), stdout=TRUE)
              h <- grep('^[a-fA-F0-9]{64}$', trimws(out), value=TRUE)
              stopifnot(length(h)==1L)
              tolower(h)
            }
            on.exit({
              writeLines(.libPaths(), file.path(records, 'library-paths.txt'))
              vars <- c('R_LIBS_USER','R_LIBS_SITE','R_LIBS','NOT_CRAN','_R_CHECK_FORCE_SUGGESTS_','R_ENVIRON_USER','R_PROFILE_USER','OPENBLAS_NUM_THREADS','OMP_NUM_THREADS','MAKEFLAGS')
              jsonlite::write_json(as.list(Sys.getenv(vars)), file.path(records, 'relevant-environment.json'), pretty=TRUE, auto_unbox=TRUE)
              plots <- unique(c(list.files(root, all.files=TRUE, recursive=TRUE, full.names=TRUE), list.files(Sys.getenv('GITHUB_WORKSPACE'), all.files=TRUE, recursive=TRUE, full.names=TRUE)))
              plots <- plots[grepl('(^|/)Rplots[.]pdf$', plots, ignore.case=TRUE)]
              metadata <- lapply(plots, function(f) tryCatch(list(path=f, size_bytes=file.info(f)$size, ctime=as.character(file.info(f)$ctime), mtime=as.character(file.info(f)$mtime), sha256=sha256(f)), error=function(e) list(path=f,error=conditionMessage(e))))
              jsonlite::write_json(metadata, file.path(records, 'rplots-metadata.json'), pretty=TRUE, auto_unbox=TRUE)
              writeLines(capture.output(sessionInfo()), file.path(records, 'session-info.txt'))
              write.table(installed.packages()[,c('Package','Version','LibPath')], file.path(records, 'dependency-versions.tsv'), sep='\t', row.names=FALSE, quote=FALSE)
              writeLines(list.files(root, all.files=TRUE, recursive=TRUE, no..=TRUE), file.path(records, 'directory-listing-after.txt'))
              logs <- list.files(checkdir, recursive=TRUE, full.names=TRUE)
              logs <- logs[grepl('(^|/)(00check[.]log|00install[.]out|testthat[.]Rout([.]fail)?)$', logs)]
              for (f in logs) {
                rel <- substring(f, nchar(checkdir)+2L)
                dest <- file.path(records, 'check-logs', rel)
                dir.create(dirname(dest), recursive=TRUE, showWarnings=FALSE)
                file.copy(f, dest)
              }
            }, add=TRUE)
            expected_library <- file.path(Sys.getenv('RUNNER_TEMP'), 'cran071-private-library')
            stopifnot(dir.exists(expected_library), tolower(normalizePath(expected_library)) %in% tolower(normalizePath(.libPaths())))
            writeLines(c(R.version.string, paste('svn revision:', R.version$svn.rev)), file.path(records, 'r-devel-version.txt'))
            entries <- utils::untar(archive, list=TRUE)
            writeLines(entries, file.path(records, 'archive-inventory.txt'))
            normalized <- gsub('\\\\', '/', entries)
            stopifnot(length(entries)==889L, !any(grepl('(^|/)Rplots[.]pdf$', normalized, ignore.case=TRUE)))
            utils::untar(archive, exdir=inspection)
            writeLines(list.files(inspection, all.files=TRUE, recursive=TRUE, no..=TRUE), file.path(records, 'source-listing-before-check.txt'))
            stopifnot(!file.exists(file.path(inspection, 'gllvmTMB', 'Rplots.pdf')))
            stopifnot(length(list.files(checkdir, all.files=TRUE, no..=TRUE))==0L)
            hash <- system2('certutil', c('-hashfile', shQuote(archive), 'SHA256'), stdout=TRUE)
            stopifnot(any(grepl('dd8a811fbc273774db44b3284ca7cac7b724da5539c5fafebc14fcac0a2df557', tolower(hash), fixed=TRUE)), file.info(archive)$size==4428330)
            writeLines(hash, file.path(records, 'hash-immediately-before-check.txt'))
            start <- Sys.time()
            result <- rcmdcheck::rcmdcheck(path=archive, args=c('--as-cran','--run-donttest'), check_dir=checkdir, error_on='never')
            checked_copy <- file.path(checkdir, 'gllvmTMB_0.7.1.tar.gz')
            stopifnot(file.exists(checked_copy))
            copy_identity <- list(path=checked_copy, sha256=sha256(checked_copy), size_bytes=file.info(checked_copy)$size)
            jsonlite::write_json(copy_identity, file.path(records, 'checked-copy-identity.json'), pretty=TRUE, auto_unbox=TRUE)
            stopifnot(copy_identity$sha256=='dd8a811fbc273774db44b3284ca7cac7b724da5539c5fafebc14fcac0a2df557', copy_identity$size_bytes==4428330)
            summary <- list(sha256='dd8a811fbc273774db44b3284ca7cac7b724da5539c5fafebc14fcac0a2df557', r_version=R.version.string, elapsed_seconds=as.numeric(difftime(Sys.time(),start,units='secs')), errors=result$errors, warnings=result$warnings, notes=result$notes)
            jsonlite::write_json(summary, file.path(records,'check-summary.json'), auto_unbox=TRUE, pretty=TRUE)
            stopifnot(length(result$errors)==0L, length(result$warnings)==0L, !any(grepl('Rplots[.]pdf', result$notes, ignore.case=TRUE)))
          }
          main()
      - name: Retain diagnostic logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cran071-dd8a811f-isolated-windows-devel-logs
          path: ${{ runner.temp }}/cran071-dd8a811f-isolated/records
          retention-days: 1
          if-no-files-found: warn
