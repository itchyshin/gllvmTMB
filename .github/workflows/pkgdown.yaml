on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown
  # Never cancel an in-flight deploy. The deploy job is short and idempotent
  # (it re-publishes the rendered site). Cancelling it buys nothing, but when
  # several merges land in quick succession it was killing good-tree deploys
  # mid-publish while letting a stale-tree deploy run to a failed completion.
  # Let every deploy finish; the last one to run wins.
  cancel-in-progress: false

jobs:
  pkgdown:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Build the current tip of the branch the check ran on, NOT the
          # triggering run's pinned head_sha. R-CMD-check does not cancel main
          # runs, so several can run concurrently for different commits; when an
          # older run finishes late it fires this deploy with its stale head_sha
          # and rebuilds a superseded tree. That is exactly how a deploy of
          # commit a4310885 (before #394 indexed impute_model / imputed) failed
          # with "2 topics missing from index" even though main was already
          # fixed. Checking out the branch ref deploys whatever is currently on
          # main; workflow_dispatch falls back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/configure-pages@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Rebuild TMB-linked packages from source
        # `needs: website` installs a BINARY glmmTMB compiled against whatever
        # TMB it was built with, but the runner resolves TMB independently from
        # RSPM. When the two drift, build_site() dies loading glmmTMB for the
        # cross-package articles:
        #   glmmTMB was built with TMB package version 1.9.21
        #   Current TMB package version is 1.9.23
        #   -> base::dyn.load() fails -> Execution halted
        # That is exactly how this workflow failed at fe8388d9 and b87ab9ed
        # while R-CMD-check passed at the same commits. Rebuilding from source
        # links glmmTMB against the TMB actually installed here.
        #
        # Only glmmTMB is rebuilt because only glmmTMB is known to break. gllvm
        # and sdmTMB are also TMB-linked; if one ever fails the same way, add it
        # to this vector rather than pre-emptively rebuilding all of them.
        run: install.packages("glmmTMB", type = "source", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Hide internal agent-instruction files from pkgdown
        # pkgdown 2.2.0 renders every root .md (incl. AGENTS.md, CLAUDE.md) as a
        # public page AND indexes it in search.json / sitemap.xml, honoring
        # neither .Rbuildignore nor any exclude config. These are internal agent
        # instructions, not user docs. Move them out of pkgdown's view for the
        # build so no page, search entry, or sitemap entry is produced. The CI
        # checkout is ephemeral; the restore step is hygiene only.
        run: mkdir -p .pkgdown-hidden && mv AGENTS.md CLAUDE.md .pkgdown-hidden/
        shell: bash

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Restore internal agent-instruction files
        if: always()
        run: mv .pkgdown-hidden/AGENTS.md .pkgdown-hidden/CLAUDE.md . && rmdir .pkgdown-hidden
        shell: bash

      - uses: actions/upload-pages-artifact@v4
        with:
          # Matches `destination: pkgdown-site` in _pkgdown.yml.
          # `docs/` hosts design + dev-log scaffolding, not the rendered site.
          path: pkgdown-site

      - id: deployment
        # Publish ONLY from the default branch. The job admits workflow_dispatch
        # (see the job-level `if:`), so without this guard dispatching pkgdown on
        # any branch would build AND publish that branch to the live public site.
        # With it, a dispatch on a feature branch builds without deploying —
        # which is how a docs-build fix gets verified before it is merged.
        #
        # Both trigger shapes expose the branch differently: workflow_run gives
        # `workflow_run.head_branch`, workflow_dispatch gives `github.ref`. A
        # workflow_run always executes in the default-branch context, so its
        # `github.ref` is refs/heads/main regardless — harmless only because the
        # trigger's own `branches:` filter already restricts it.
        if: ${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
        uses: actions/deploy-pages@v4
