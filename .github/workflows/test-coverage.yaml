# Test coverage producer for gllvmTMB.
#
# This job MEASURES line coverage with covr. It does not upload to Codecov and
# must not hold id-token: write. Trusted upload lives in codecov-upload.yaml
# and runs only after a successful main-branch producer. Pull requests never
# obtain upload credentials.
#
# Shards reuse GLLVMTMB_TEST_SHARD="k/4" so the four jobs partition the suite
# exactly once (tests/testthat/helper-shard-util.R). One OS, one R version:
# repeating Ubuntu/macOS/Windows or attaching coverage to R-CMD-check would
# double-count. Existing R-CMD-check shards are unchanged and do not upload
# coverage. GLLVMTMB_HEAVY_TESTS stays unset, matching the fast R-CMD-check
# suite; this is not a scientific interval-coverage campaign (D-50).
#
# pull_request_target is deliberately absent. No CODECOV_TOKEN is read or
# invented. GITHUB_PAT is the standard r-lib GitHub token for package
# installs, not a Codecov token.
#
# Push-to-main is required because Codecov OIDC upload is main-only, so the
# producer must run on main to create the trusted artifact. This is a
# coverage job, not a second R CMD check. Coverage coberturas use 7-day
# retention; they are not campaign results.

on:
  push:
    branches: [main, master]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/test-coverage.yaml"
      - ".github/workflows/codecov-upload.yaml"
      - "codecov.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/test-coverage.yaml"
      - ".github/workflows/codecov-upload.yaml"
      - "codecov.yml"
  workflow_dispatch:

name: test-coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: ubuntu-latest (release) coverage shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
      GLLVMTMB_TEST_SHARD: ${{ format('{0}/4', matrix.shard) }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Record tested commit
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "github_sha=${GITHUB_SHA}"
            echo "pr_head=${{ github.event.pull_request.head.sha }}"
            echo "shard=${GLLVMTMB_TEST_SHARD}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
          } | tee coverage-identity.txt

      - name: Test coverage
        run: |
          shard <- Sys.getenv("GLLVMTMB_TEST_SHARD")
          if (!nzchar(shard)) {
            stop("GLLVMTMB_TEST_SHARD must be set so coverage shards partition tests")
          }
          cat(sprintf("coverage_commit=%s\n", system("git rev-parse HEAD", intern = TRUE)))
          cat(sprintf("GLLVMTMB_TEST_SHARD=%s\n", shard))
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            type = "tests",
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf(
            paste0(
              "shard_percent_coverage=%.4f (shard %s only; Codecov merges ",
              "complementary shards after a trusted main upload)\n"
            ),
            pct, shard
          ))
          writeLines(
            sprintf("shard_percent_coverage=%.4f", pct),
            "coverage-percent.txt"
          )
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Save pull-request coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-coverage-shard-${{ matrix.shard }}
          path: |
            cobertura.xml
            coverage-identity.txt
            coverage-percent.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save coverage report for trusted upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-coverage-shard-${{ matrix.shard }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-test-failures-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/package
          retention-days: 7
